name: Rust desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: RUST
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RUST
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev xvfb
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --test-threads=1
      - run: cargo build --release
      - name: macOS bundle
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh
      - name: Windows executable
        if: runner.os == 'Windows'
        run: Copy-Item target/release/getitdone.exe releases/windows/GetItDone.exe
      - name: Linux executable
        if: runner.os == 'Linux'
        run: cp target/release/getitdone releases/linux/GetItDone
      - uses: actions/upload-artifact@v4
        with:
          name: GetItDone-Rust-${{ matrix.platform }}
          path: RUST/releases/${{ matrix.platform }}/GetItDone*
