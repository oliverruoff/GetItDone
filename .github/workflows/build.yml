name: Test and build desktop app
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests scripts
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm GetItDone.spec
      - name: Pack macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg
          cp -R dist/GetItDone.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname GetItDone -srcfolder dist/dmg -ov -format UDZO dist/GetItDone-macOS.dmg
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc scripts/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GetItDone-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*Setup*.exe
