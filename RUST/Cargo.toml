[package]
name = "getitdone"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
libc = "0.2"
json5 = "0.4"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.9"
vt100 = "0.16"
rfd = "0.15"
fs2 = "0.4"
tempfile = "3"
walkdir = "2"
toml = "0.9"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
open = "5"
notify-rust = "4"
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
hayro = { version = "0.8.0", features = ["embed-fonts"] }

[dev-dependencies]

[profile.release]
strip = true
lto = "thin"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSSet", "NSDate", "NSUUID"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings"] }
block2 = "0.6"
dispatch2 = "0.3"
