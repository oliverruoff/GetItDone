[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "getitdone-notebook"
version = "0.1.0"
description = "Lokales PO-Arbeitsnotizbuch mit Agent-Terminals und Wissensbereich"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "python-docx>=1.1,<2", "pywinpty>=2.0.15; sys_platform == 'win32'", "pyobjc-framework-UserNotifications>=10; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "pyinstaller>=6,<7", "ruff>=0.9"]

[project.gui-scripts]
getitdone = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.terminal" = ["web/*"]
"app.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
